input {
  file {
    path => "/usr/share/logstash/pipeline/logs/app.log"
    start_position => "beginning"
    # IMPORTANTE: Essa linha avisa o Logstash para esquecer o histórico de leitura e ler tudo de novo no teste
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "info-brasil-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
